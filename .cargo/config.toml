# gtk4-layer-shell-devel isn't required: install.sh writes a pkg-config shim
# into build/ that links against the runtime library instead.
[env]
PKG_CONFIG = "/usr/bin/pkg-config"
PKG_CONFIG_PATH = { value = "build/pkgconfig", relative = true }

# install.sh always compiles on the machine that runs the binary, so use its
# full instruction set (AVX2 etc.): the image loops vectorise much better
# (measured: preview downscale -48% instructions, editor view -26%).
[build]
rustflags = ["-C", "target-cpu=native"]
